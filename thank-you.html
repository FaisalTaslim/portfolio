<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent | Faisal Taslim</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="stylesheet/utilities/themes/palette-1.css">
  <link rel="stylesheet" href="stylesheet/utilities/font-styles/font-size.css">
  <link rel="stylesheet" href="stylesheet/utilities/font-styles/font-family.css">
  <link rel="stylesheet" href="stylesheet/thankyou.css">
  <script src="https://kit.fontawesome.com/f75c66b724.js" crossorigin="anonymous"></script>
</head>

<body>
  <main class="thankyou-main">
    <div class="terminal">
      <div class="terminal-bar">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-title">message.sh</span>
      </div>
      <div class="terminal-body">
        <p class="line cmd">$ ./send_message --to faisal</p>
        <p class="line out delay-1">Connecting to server...</p>
        <p class="line out delay-2">Authenticating... ok</p>
        <p class="line out delay-3">Status: <span class="status-ok">200 OK</span></p>
        <p class="line out delay-4">Message delivered <span class="check">✓</span></p>
        <p class="line out delay-4 final-thanks">Thanks for reaching out — I read every message and will get back to you as soon as I can.</p>
        <p class="line cmd delay-5">$ <span class="cursor">_</span></p>
      </div>
    </div>

    <div class="thankyou-text">
      <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
    </div>
  </main>
</body>

</html>
